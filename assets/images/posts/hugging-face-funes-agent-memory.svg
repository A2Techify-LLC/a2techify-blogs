<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agent memory you own</title>
  <desc id="desc">A2Techify field note card about Hugging Face Funes and local-first agent memory.</desc>

  <defs>
    <pattern id="grid" width="80" height="70" patternUnits="userSpaceOnUse">
