  <text x="104" y="363" fill="#bfcbe0" font-family="Inter, Arial, sans-serif" font-size="25">Verbatim sessions. Provenance.</text>
  <text x="104" y="399" fill="#bfcbe0" font-family="Inter, Arial, sans-serif" font-size="25">Local retrieval.</text>
