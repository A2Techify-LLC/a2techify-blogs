<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kitesurf Is Open Source: Test an Agent Browser Without Chromium</title>
  <desc id="desc">A branded A2Techify social card showing an agent connecting through CDP to a lightweight browser engine.</desc>
  <rect width="1200" height="630" fill="#10120f"/>
