  <text x="116" y="178" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="700">Automatic Key Exchange</text>
  <text x="118" y="224" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="26">Cloudflare measures origin TLS support, then leads with the strongest safe key share.</text>
  <g transform="translate(134 292)">
