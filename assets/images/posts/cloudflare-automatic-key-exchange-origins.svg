    <text x="28" y="48" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Origin Server</text>
    <text x="28" y="78" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">Measured daily</text>
