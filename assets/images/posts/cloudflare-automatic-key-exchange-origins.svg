<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare Automatic Key Exchange</title>
  <desc id="desc">Dark A2Techify social card showing Cloudflare selecting post-quantum origin TLS key exchange.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#101827"/>
      <stop offset="1" stop-color="#121a12"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f48120"/>
      <stop offset="0.5" stop-color="#f7b955"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#94a3b8" stroke-width="1">
    <path d="M80 110H1120"/>
