  <text x="104" y="312" fill="#f7f8f5" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900">Caches Hot MoE</text>
  <text x="104" y="380" fill="#f7f8f5" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900">Experts in VRAM</text>
  <text x="104" y="468" fill="#c8cec3" font-family="Inter, Arial, sans-serif" font-size="28">Keep the full expert set in RAM. Reuse the hot path on GPU.</text>
