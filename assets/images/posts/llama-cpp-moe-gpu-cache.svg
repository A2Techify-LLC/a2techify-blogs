<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">llama.cpp v0.7.0 Adds a GPU Cache for CPU-Offloaded MoE Experts</title>
  <desc id="desc">A branded A2Techify social card showing frequently used model experts moving from host memory into a compact GPU cache.</desc>
  <rect width="1200" height="630" fill="#10120f"/>
  <rect x="64" y="64" width="1072" height="502" rx="8" fill="#171a15" stroke="#ffca5f" stroke-opacity=".4" stroke-width="2"/>
  <text x="104" y="145" fill="#ffca5f" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800">A2Techify Field Notes</text>
