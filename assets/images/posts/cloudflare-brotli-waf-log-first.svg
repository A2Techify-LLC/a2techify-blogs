    <rect x="64" y="211" width="92" height="42" rx="7" fill="#24362d" stroke="#80e9ff" stroke-width="3"/>
    <text x="110" y="240" text-anchor="middle" fill="#80e9ff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800">LOG</text>
  </g>
  <path d="M748 236h74M748 315h74M748 394h74" stroke="#c8cec3" stroke-width="7" stroke-linecap="round"/>
  <circle cx="730" cy="236" r="13" fill="#80e9ff"/>
