<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare's Brotli WAF Rules Start in Log Mode for a Reason</title>
  <desc id="desc">A branded A2Techify social card showing Brotli and Next.js requests entering a log-first WAF.</desc>
  <rect width="1200" height="630" fill="#10120f"/>
  <rect x="64" y="64" width="1072" height="502" rx="8" fill="#171a15" stroke="#ffca5f" stroke-opacity=".4" stroke-width="2"/>
  <text x="104" y="145" fill="#ffca5f" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800">A2Techify Field Notes</text>
  <text x="104" y="238" fill="#f7f8f5" font-family="Inter, Arial, sans-serif" font-size="53" font-weight="900">Brotli WAF Rules:</text>
  <text x="104" y="304" fill="#f7f8f5" font-family="Inter, Arial, sans-serif" font-size="53" font-weight="900">Observe Before Block</text>
  <text x="104" y="394" fill="#c8cec3" font-family="Inter, Arial, sans-serif" font-size="28">Audit effective actions before production traffic changes</text>
  <text x="104" y="458" fill="#80e9ff" font-family="Inter, Arial, sans-serif" font-size="25">Content-Encoding: br · /_next/image · Log first</text>
