---
layout: default
---

<section class="page-hero">
  <div class="wrap page-hero-grid">
    <div>
      <span class="eyebrow eyebrow-light">A2Techify / Field Notes</span>
      <h1>{{ page.title }}</h1>
    </div>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </div>
</section>

<section class="content-section">
  <article class="wrap prose page-prose{% if page.url contains '/tags/' %} directory-prose{% endif %}">
    {{ content }}
  </article>
</section>
