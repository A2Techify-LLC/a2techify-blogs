<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo-head.html %}
    {% feed_meta %}
    <link rel="icon" href="{{ site.logo | relative_url }}" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="{{ site.logo | relative_url }}" sizes="192x192">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="wrap nav-wrap">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="brand-mark" aria-hidden="true">
            <img src="{{ site.logo | relative_url }}" alt="" width="44" height="44">
          </span>
          <span class="brand-copy">
            <strong>A2Techify</strong>
            <small>Field Notes</small>
          </span>
        </a>

        <nav class="site-nav" aria-label="Primary navigation">
          <a{% if page.url == '/' %} aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Articles</a>
          <a{% if page.url contains '/tags/' %} aria-current="page"{% endif %} href="{{ '/tags/' | relative_url }}">Topics</a>
          <a{% if page.url == '/about/' %} aria-current="page"{% endif %} href="{{ '/about/' | relative_url }}">About</a>
          <a class="nav-external" href="https://github.com/{{ site.github_username }}" rel="me">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>

    <main id="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrap footer-grid">
        <div>
          <div class="footer-kicker">A2Techify Field Notes</div>
          <p>Practical engineering notes from the team at A2Techify.</p>
        </div>
        <div class="footer-links">
          <a href="https://www.a2techify.com">A2Techify.com</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
          <a href="{{ '/terms/' | relative_url }}">Terms</a>
          <a href="mailto:{{ site.email }}">{{ site.email }}</a>
          <a href="https://github.com/{{ site.github_username }}">Code</a>
        </div>
      </div>
    </footer>
  </body>
</html>
