<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    {% feed_meta %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="wrap nav-wrap">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="brand-mark">A2</span>
          <span>
            <strong>A2Techify</strong>
            <small>Engineering Briefs</small>
          </span>
        </a>

        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Briefs</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="https://github.com/{{ site.github_username }}" rel="me">GitHub</a>
        </nav>
      </div>
    </header>

    <main id="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrap footer-grid">
        <div>
          <div class="footer-kicker">A2Techify Blogs</div>
          <p>Practical technology notes for teams that build, ship, and operate software.</p>
        </div>
        <div class="footer-links">
          <a href="https://a2techify.com">A2Techify.com</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          <a href="mailto:{{ site.email }}">{{ site.email }}</a>
          <a href="https://github.com/{{ site.github_username }}">GitHub</a>
        </div>
      </div>
    </footer>
  </body>
</html>
